services:
  postgres:
    image: postgres:16-alpine
    container_name: mealio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mealio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mealio_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mealio_postgres_data:
